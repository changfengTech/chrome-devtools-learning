<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">DevTools 实验室：把问题变成证据</title>
  <desc id="desc">中文讲解，英文工具。通过交互演示、真实商城实战与独立挑战，学习复现、取证、定位和验证。</desc>
  <rect x="1" y="1" width="1278" height="358" rx="20" fill="#F6F8FC" stroke="#DFE6F1" stroke-width="2"/>
  <path d="M1 62H1279" stroke="#DFE6F1" stroke-width="2"/>
  <circle cx="31" cy="32" r="6" fill="#D69B32"/>
  <circle cx="53" cy="32" r="6" fill="#4C8EF7"/>
  <circle cx="75" cy="32" r="6" fill="#168267"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="106" y="38" fill="#657189" font-size="17">Chrome DevTools / Learning by debugging</text>
    <text x="1178" y="38" fill="#657189" font-size="15" text-anchor="end">本地学习版</text>
    <rect x="48" y="99" width="60" height="60" rx="17" fill="#245DE8"/>
    <path d="M71 117L61 129L71 141M85 117L95 129L85 141M82 112L75 146" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="128" y="124" fill="#1C2940" font-size="23" font-weight="600">DevTools 实验室</text>
    <text x="128" y="152" fill="#657189" font-size="15">中文讲解 · 英文工具名称</text>
    <text x="48" y="225" fill="#1C2940" font-size="43" font-weight="650">把问题变成证据。</text>
    <text x="48" y="271" fill="#657189" font-size="19">从「会打开」到「会排查」，在真实页面里练习。</text>
    <text x="48" y="318" fill="#245DE8" font-size="16">交互演示</text>
    <path d="M128 312H157" stroke="#8FA6D0" stroke-width="1.5"/><path d="M152 308L157 312L152 316" stroke="#8FA6D0" stroke-width="1.5"/>
    <text x="176" y="318" fill="#245DE8" font-size="16">商城实战</text>
    <path d="M255 312H284" stroke="#8FA6D0" stroke-width="1.5"/><path d="M279 308L284 312L279 316" stroke="#8FA6D0" stroke-width="1.5"/>
    <text x="303" y="318" fill="#245DE8" font-size="16">独立挑战</text>
    <rect x="680" y="98" width="552" height="226" rx="12" fill="white" stroke="#DFE6F1"/>
    <path d="M680 144H1232" stroke="#DFE6F1"/>
    <text x="704" y="127" fill="#657189" font-size="14">一份可以复查的排查记录</text>
    <rect x="704" y="167" width="60" height="27" rx="5" fill="#EAF0FC"/>
    <text x="734" y="186" fill="#245DE8" font-size="13" text-anchor="middle">现象</text>
    <text x="781" y="186" fill="#1C2940" font-size="17">点击一次，购物车却增加两次。</text>
    <rect x="704" y="211" width="60" height="27" rx="5" fill="#EAF0FC"/>
    <text x="734" y="230" fill="#245DE8" font-size="13" text-anchor="middle">证据</text>
    <text x="781" y="230" fill="#1C2940" font-size="17">同一个 click 触发两个监听器。</text>
    <rect x="704" y="255" width="60" height="27" rx="5" fill="#EAF5F0"/>
    <text x="734" y="274" fill="#168267" font-size="13" text-anchor="middle">验证</text>
    <text x="781" y="274" fill="#1C2940" font-size="17">只改一处，使用相同输入复测。</text>
  </g>
</svg>
